version = 1
name = "pathway"

[setup]
script = '''
set -eu

cd "${CODEX_WORKTREE_PATH:-$PWD}"
WORKTREE_ROOT="$(pwd -P)"
SOURCE_ROOT="/Users/coreybaines/GitHub/pathway"

# Refuse to run against the main checkout.
test -f "$WORKTREE_ROOT/.git"
test "$WORKTREE_ROOT" != "$SOURCE_ROOT"

for ENV_FILE in \
  .env \
  .env.local \
  .env.prod \
  infra/relay/.env \
  infra/relay/.env.local \
  infra/relay/.env.prod \
  infra/relay/.env.prod.local
do
  test -f "$SOURCE_ROOT/$ENV_FILE" || continue

  # Replace old symlinks with independent copies.
  if test -L "$ENV_FILE"; then
    rm -- "$ENV_FILE"
  fi

  # Preserve worktree-specific edits when setup is rerun.
  if ! test -e "$ENV_FILE"; then
    mkdir -p "$(dirname "$ENV_FILE")"
    cp "$SOURCE_ROOT/$ENV_FILE" "$ENV_FILE"
    chmod 600 "$ENV_FILE"
  fi
done

vp i
node apps/web/scripts/warm-dep-cache.ts
node scripts/configure-pathway-ios.ts'''

[cleanup]
script = '''
set -eu

cd "${CODEX_WORKTREE_PATH:-$PWD}"
WORKTREE_ROOT="$(pwd -P)"

# Refuse to clean the main checkout.
test -f "$WORKTREE_ROOT/.git"
test "$WORKTREE_ROOT" != "/Users/coreybaines/GitHub/pathway"

vp run clean'''
