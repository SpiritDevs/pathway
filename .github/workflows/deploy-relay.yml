name: Deploy Pathway Connect relay

on:
  push:
    branches:
      - main
    paths:
      - infra/relay/**
      - packages/backend/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/deploy-relay.yml

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  cyndrbase:
    name: Require Cyndrbase deployment
    runs-on: ${{ fromJSON(vars.FLEET_MACOS_RUNNER || '["self-hosted","fleet-macos-arm64"]') }}
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for a Cyndrbase deployment
        id: check
        env:
          RELAY_CYNDRBASE_DEPLOYMENT_URL: ${{ vars.RELAY_CYNDRBASE_DEPLOYMENT_URL }}
        run: |
          if [[ -n "$RELAY_CYNDRBASE_DEPLOYMENT_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Relay deploy skipped::The production environment has no RELAY_CYNDRBASE_DEPLOYMENT_URL, so the relay deploy is skipped (see the relay README's Convex cutover). It never falls back to Convex."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy_relay:
    name: Deploy production relay
    needs: cyndrbase
    if: needs.cyndrbase.outputs.configured == 'true'
    runs-on: ${{ fromJSON(vars.FLEET_MACOS_RUNNER || '["self-hosted","fleet-macos-arm64"]') }}
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      CYNDRBASE_DEPLOYMENT_URL: ${{ vars.RELAY_CYNDRBASE_DEPLOYMENT_URL }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CYNDRBASE_CONNECT_API_URL: ${{ vars.CYNDRBASE_CONNECT_API_URL }}
      CYNDRBASE_CONNECT_EDGE_URL: ${{ vars.CYNDRBASE_CONNECT_EDGE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: ${{ vars.APNS_ENABLED || 'true' }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      MAIL_ENABLED: ${{ vars.MAIL_ENABLED || 'false' }}
      MAIL_GOOGLE_PUBSUB_TOPIC: ${{ vars.MAIL_GOOGLE_PUBSUB_TOPIC }}
      MAIL_GOOGLE_PUBSUB_SERVICE_ACCOUNT: ${{ vars.MAIL_GOOGLE_PUBSUB_SERVICE_ACCOUNT }}
      MAIL_GOOGLE_CLIENT_ID: ${{ vars.MAIL_GOOGLE_CLIENT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require Pathway Connect settings
        env:
          CYNDRBASE_CONNECT_ADMIN_KEY: ${{ secrets.CYNDRBASE_CONNECT_ADMIN_KEY }}
          CYNDRBASE_CONNECT_TOKEN_KEY: ${{ secrets.CYNDRBASE_CONNECT_TOKEN_KEY }}
        run: |
          missing=()
          for name in CYNDRBASE_CONNECT_API_URL CYNDRBASE_CONNECT_EDGE_URL CYNDRBASE_CONNECT_ADMIN_KEY CYNDRBASE_CONNECT_TOKEN_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Pathway Connect not configured::The production environment is missing ${missing[*]}, so managed tunnels would fail."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=pathway-relay...

      - name: Deploy production relay stage
        id: deploy
        run: vp run --filter pathway-relay deploy --stage prod --yes --github-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CYNDRBASE_CONNECT_ADMIN_KEY: ${{ secrets.CYNDRBASE_CONNECT_ADMIN_KEY }}
          CYNDRBASE_CONNECT_TOKEN_KEY: ${{ secrets.CYNDRBASE_CONNECT_TOKEN_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          MAIL_ENCRYPTION_KEY: ${{ secrets.MAIL_ENCRYPTION_KEY }}
          MAIL_UPLOADTHING_API_KEY: ${{ secrets.MAIL_UPLOADTHING_API_KEY }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@v8
        with:
          script: |
            const result = "${{ steps.deploy.outputs.result }}";
            const changed = "${{ steps.deploy.outputs.changed }}" === "true";
            const description = changed
              ? "Relay production deploy applied infrastructure changes."
              : result === "noop"
                ? "Relay production deploy was a no-op."
                : `Relay production deploy completed with result: ${result}.`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
