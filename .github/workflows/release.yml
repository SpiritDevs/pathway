name: Deploy cloud registration fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  deploy_backend:
    name: Deploy and verify production backend
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    environment:
      name: production
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Verify registration and queue recovery
        run: |
          vp test run packages/backend/src/environments.test.ts packages/backend/src/threadQueue.test.ts
          vp exec --filter @spiritdevs/backend -- tsgo --noEmit
      - name: Deploy production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          node --input-type=module <<'JS'
          const target = /^prod:([^|]+)\|/.exec(process.env.CONVEX_DEPLOY_KEY ?? '')?.[1];
          if (target !== 'sleek-lion-657') throw new Error('Deploy key must target production sleek-lion-657');
          console.log('Verified production deployment target:', target);
          JS
          vp exec --filter @spiritdevs/backend -- convex deploy --typecheck disable --codegen disable --message "Fix desktop cloud registration and queue discovery ($GITHUB_SHA)"
      - name: Inspect affected production queue
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const rows = (table) => JSON.parse(execFileSync('node_modules/.bin/convex', ['data', table, '--format', 'json', '--limit', '1000'], {encoding:'utf8', maxBuffer:32 * 1024 * 1024}));
          const environmentId = '82d76fc5-9480-4b12-8d5d-9154fd3774e2';
          const threadId = '3d00306c-e628-4eb7-b1a8-a445623b97ba';
          console.log('Affected environment:', JSON.stringify(rows('environmentRegistrations').filter(row => row.environmentId === environmentId).map(row => ({environmentId:row.environmentId, state:row.state, serverVersion:row.descriptor?.serverVersion, durableThreadQueue:row.descriptor?.capabilities?.durableThreadQueue ?? false, updatedAt:row.updatedAt}))));
          console.log('Affected queue:', JSON.stringify(rows('threadQueueThreads').filter(row => row.environmentId === environmentId && row.threadId === threadId).map(row => ({threadId:row.threadId, state:row.state, queuedCount:row.queuedCount, acceptedAt:row.acceptedAt, updatedAt:row.updatedAt}))));
          JS
