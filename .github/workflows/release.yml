name: Release
run-name: Remote thread dispatch backend (${{ inputs.dry_run && 'preview' || 'deploy' }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the backend changes without deploying
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  remote_dispatch_backend:
    name: Deploy remote thread dispatch backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Verify remote command authorization
        run: vp test run packages/backend/src/environmentCommands.test.ts
      - name: Deploy the approved backend change
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          EXPECTED_CONVEX_URL: ${{ vars.CONVEX_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const target = /^prod:([a-z0-9-]+)\|/u.exec(process.env.CONVEX_DEPLOY_KEY ?? '')?.[1];
          const expected = 'https://sleek-lion-657.convex.cloud';
          if (!target || `https://${target}.convex.cloud` !== expected || process.env.EXPECTED_CONVEX_URL !== expected) {
            throw new Error('Production deployment configuration does not match the approved target.');
          }
          const args = ['exec', '--filter', '@spiritdevs/backend', '--', 'convex', 'deploy', '--typecheck', 'disable', '--codegen', 'disable', '--message', 'Remote thread dispatch fix 58341cbc2'];
          if (process.env.DRY_RUN === 'true') args.push('--dry-run');
          const { CONVEX_DEPLOYMENT: unused, ...env } = process.env;
          const child = spawnSync('vp', args, { stdio: 'inherit', env });
          process.exit(child.status ?? 1);
          JS
